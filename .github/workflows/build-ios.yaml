name: Build CLEO iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            xz-utils \
            dpkg \
            python3 \
            build-essential

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cleo-ios-linux
          cache-on-failure: true

      - name: Cache iOS toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/ios-toolchain
          key: ios-toolchain-bingner-v10.0.0-2

      - name: Download Bingner iOS toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl -L \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o /tmp/ios-toolchain.tar.lzma

          sudo mkdir -p /opt/ios-toolchain
          sudo tar --lzma \
            -xf /tmp/ios-toolchain.tar.lzma \
            -C /opt/ios-toolchain

      - name: Locate iOS toolchain
        shell: bash
        run: |
          TOOLCHAIN_ROOT=$(find /opt/ios-toolchain -type d -name ios-arm64e-clang-toolchain | head -1)

          if [ -z "$TOOLCHAIN_ROOT" ]; then
            echo "Unable to locate ios-arm64e-clang-toolchain"
            exit 1
          fi

          echo "TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          echo "CLEO_CLANG=$TOOLCHAIN_ROOT/bin/clang" >> "$GITHUB_ENV"
          echo "CLEO_LDID=$TOOLCHAIN_ROOT/bin/ldid" >> "$GITHUB_ENV"

      - name: Cache iOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /opt/ios-sdk
          key: ios-sdk-theos-current-v1

      - name: Download iOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/ios-sdk

          curl -L \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            -o /tmp/theos-sdks.tar.gz

          sudo tar -xzf /tmp/theos-sdks.tar.gz \
            -C /opt/ios-sdk

      - name: Locate iOS SDK
        shell: bash
        run: |
          SDK=$(find /opt/ios-sdk -type d -name "iPhoneOS*.sdk" | sort -V | tail -1)

          if [ -z "$SDK" ]; then
            echo "Unable to locate iPhoneOS SDK"
            exit 1
          fi

          echo "CLEO_IOS_SDK=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK"

      - name: Show build environment
        run: |
          echo "CLEO_CLANG=$CLEO_CLANG"
          echo "CLEO_LDID=$CLEO_LDID"
          echo "CLEO_IOS_SDK=$CLEO_IOS_SDK"

          rustc --version
          cargo --version
          "$CLEO_CLANG" --version

      - name: Build CLEO
        run: |
          python3 build.py --release --verbose

      - name: Show output
        run: |
          find target/aarch64-apple-ios/release \
            -maxdepth 1 \
            -type f \
            -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          if [ -f target/aarch64-apple-ios/release/cleo.dylib ]; then
            cp target/aarch64-apple-ios/release/cleo.dylib artifact/cleo.dylib
          elif [ -f target/aarch64-apple-ios/release/libcleo.dylib ]; then
            cp target/aarch64-apple-ios/release/libcleo.dylib artifact/cleo.dylib
          else
            echo "CLEO dylib was not produced"
            exit 1
          fi

      - name: Upload CLEO dylib
        uses: actions/upload-artifact@v4
        with:
          name: cleo-ios-linux
          path: artifact/cleo.dylib
